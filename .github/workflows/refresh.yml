# The weekly tool refresh, across the platforms the tools actually run on.
#
# Split the way the work splits: a Linux runner cannot tell you what a tool's
# `--help` says on Windows, so each platform *gathers* — observing releases and
# writing a document of what it saw — and one job *assembles*, folding all three
# into the store. One process holds the pen; three machines committing to
# tool-history/ would be three whole-file conflicts a week.
#
# The release decision stays "were any events appended", never "did a version
# move". A platform looking for the first time widens coverage without being
# news, and the PR opens on any tree change so a week's findings are never
# recomputed next Monday.
#
# An index that would not answer FAILS the run (exit 75): a renamed package
# answers "nothing new" forever, and that must never read as success. A leg
# that dies fails the workflow too — a silently two-platform week would tag
# absences on a platform that simply never reported.
name: refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gather:
    strategy:
      fail-fast: false # every leg's findings are worth having, even if one dies
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync

      - name: provision the latest tools
        # uv included, and deliberately: uv carries CPython's download index
        # inside the binary, so a stale uv reports a stale newest python. bun
        # lands here too, which the npm tier installs through.
        run: uv run fm tools.provision

      - name: observe what this platform sees
        env:
          GH_TOKEN: ${{ github.token }} # 5,000/hr; a shared runner's 60 is spent by strangers
        run: >
          uv run fm tools.gather --prefix=.tools-latest
          --out=observations/${{ matrix.os }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: observations-${{ matrix.os }}
          path: observations/

  assemble:
    needs: gather
    runs-on: ubuntu-latest
    steps:
      - name: refuse to run without the PAT
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::secrets.REFRESH_TOKEN is unset. Create a fine-grained PAT" \
                 "(this repo; contents: write, pull-requests: write) and store it as" \
                 "REFRESH_TOKEN — a PR opened with the default GITHUB_TOKEN never" \
                 "triggers CI, so the required gate would sit unrun and auto-merge" \
                 "would wait forever."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REFRESH_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync

      - uses: actions/download-artifact@v4
        with:
          path: observations
          pattern: observations-*
          merge-multiple: true

      - name: every platform must have reported
        # Not a nicety: absences are tagged per platform, so a leg that never
        # reported is a platform whose silence must not be read as an answer.
        run: |
          for os in ubuntu-latest macos-latest windows-latest; do
            test -f "observations/$os.json" || {
              echo "::error::$os produced no observation document"; exit 1; }
          done

      - name: fold them into the store
        run: uv run fm --json tools.assemble observations/*.json > assembled.json

      - name: what changed
        run: |
          git add -A -- tool-history src/footman/_stubs CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi
          jq -r '.results[] | select(.task | endswith("assemble"))
                 | .returned | "release=\(.release)"' assembled.json >> "$GITHUB_ENV"

      - name: roll the release
        # Built, and off unless the repo variable says otherwise: a stub-only
        # release is a patch bump, and whether that ships without a human
        # looking is a policy, not a mechanism.
        if: env.changed == 'true' && env.release == 'true' && vars.AUTO_RELEASE == 'true'
        run: |
          uv run fm --json tools.prepare-release > prepared.json
          jq -r '.results[] | select(.task | endswith("prepare-release"))
                 | .returned | "tag=v\(.version)"' prepared.json >> "$GITHUB_ENV"
          git add -A -- pyproject.toml src/footman/__init__.py docs/json.md CHANGELOG.md

      - name: open the pull request
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          branch="chore/tool-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(tools): weekly refresh${tag:+ — release $tag}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(tools): weekly tool refresh${tag:+ ($tag)}" \
            --body "$(printf 'Observed on ubuntu, macOS and Windows; folded by one assembler.\n\n```\n%s\n```\n\nAuto-merges once the gate is green — the gate is the reviewer here: it replays every chain, regenerates every stub, and runs the drift tests.' \
              "$(jq -r '.results[] | select(.task | endswith("assemble")) | .output' assembled.json)")"
          gh pr merge --auto --merge "$branch"

      - name: tag the release once it lands
        # Only after auto-merge actually completed: a tag on a commit that
        # never reached main points at nothing. A PAT-pushed tag triggers
        # release.yml, which a GITHUB_TOKEN-pushed one would not.
        if: env.changed == 'true' && env.tag != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          for _ in $(seq 60); do
            state=$(gh pr view "chore/tool-refresh-$(date -u +%Y%m%d)" --json state -q .state || echo UNKNOWN)
            [ "$state" = "MERGED" ] && break
            sleep 60
          done
          if [ "$state" != "MERGED" ]; then
            echo "::warning::the refresh PR has not merged yet; tag $tag by hand once it does"
            exit 0
          fi
          git fetch origin main
          git tag "$tag" origin/main
          git push origin "$tag"

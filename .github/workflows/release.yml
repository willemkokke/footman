name: Release

# Publishes to PyPI via Trusted Publishing (OIDC — no API token stored).
# One-time setup on PyPI: add a trusted publisher for this repo with
# workflow `release.yml` and environment `pypi`. Push a `vX.Y.Z` tag to release.
#
# A tag alone is not enough: the full CI suite must pass on the tagged commit,
# and the tag must agree with pyproject.toml, `__version__`, and the changelog.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The reusable ci.yml `changes` job requests pull-requests: read; a called
  # workflow's job cannot exceed the caller's grant, so it must be declared
  # here or the whole release run fails at startup.
  pull-requests: read

jobs:
  checks:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: tag == pyproject == __version__ == changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify version consistency
        run: |
          python3 - "$GITHUB_REF_NAME" << 'EOF'
          import re
          import sys
          import tomllib

          tag = sys.argv[1].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)["project"]["version"]
          init_text = open("src/footman/__init__.py", encoding="utf-8").read()
          match = re.search(r'__version__ = "([^"]+)"', init_text)
          init = match[1] if match else "(missing)"
          changelog = open("CHANGELOG.md", encoding="utf-8").read()

          problems = []
          if pyproject != tag:
              problems.append(f"pyproject.toml says {pyproject}, tag says {tag}")
          if init != tag:
              problems.append(f"__init__.__version__ says {init}, tag says {tag}")
          if f"## [{tag}]" not in changelog:
              problems.append(f"CHANGELOG.md has no '## [{tag}]' section")
          if problems:
              print("version mismatch — refusing to release:")
              print("\n".join(f"  - {p}" for p in problems))
              sys.exit(1)
          print(f"version {tag} is consistent across tag, pyproject, __init__, changelog")
          EOF

  build:
    needs: [checks, verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # The artifact the world installs is built by an exact toolchain,
          # not whatever uv shipped that morning. Bump deliberately, with a
          # release.
          version: "0.11.31"
      - name: Build sdist and wheel
        # The build backend resolves from PyPI at build time and pyproject
        # deliberately keeps a range; the release pins the exact backend so
        # the published artifact is reproducible.
        run: |
          echo "uv_build==0.11.31" > build-constraints.txt
          uv build --build-constraints build-constraints.txt
      - name: Wheel must ship py.typed
        # Listed to a file, then read: a pipe would let grep's verdict
        # replace unzip's, the exact hazard the repo's gate rule names.
        run: |
          unzip -l dist/*.whl > wheel-listing.txt
          grep "footman/py.typed" wheel-listing.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

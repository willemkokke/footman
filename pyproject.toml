[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "footman"
version = "0.49.1"
description = "A task runner with typed commands, nested groups, and instant shell completion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "willem@humain-studios.com" }]
keywords = ["task-runner", "cli", "completion", "duty", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

# Zero runtime dependencies: the completion hot path must stay stdlib-only,
# and the execution path builds its CLI from function signatures directly.
dependencies = []

# One optional extra, and it is not a library: `pip install footman[uv]`
# (or `uv tool install "footman[uv]"`) puts a uv binary in the same scripts
# directory as `fm` itself, so a globally-installed runner carries the tool
# both handoffs need — the project one, and the environment a tasks file
# declares for itself. Nothing imports it; it is found on disk.
[project.optional-dependencies]
uv = ["uv>=0.6"]

[project.urls]
Homepage = "https://github.com/willemkokke/footman"
Documentation = "https://willemkokke.github.io/footman/"
Repository = "https://github.com/willemkokke/footman"
Issues = "https://github.com/willemkokke/footman/issues"
Changelog = "https://willemkokke.github.io/footman/changelog/"

[project.scripts]
footman = "footman:main"
fm = "footman:main"

# Auto-loaded pytest fixtures (fm, fm_project, fm_record) for testing tasks.
# Zero runtime cost: only pytest itself ever imports the module.
[project.entry-points.pytest11]
footman = "footman.pytest_plugin"

# footman's own first-party tasks, advertised the way any plugin is: an
# entry point is the console-script of task trees — a stable public identity
# for a Group the package offers, inert until a tasks.py pulls it
# (`plugin("footman.docs", into="footman")`). Metadata only — a family
# imports when pulled, never on a bare `import footman`. This repo pulls
# both in its own tasks.py, exactly as a user would.
[project.entry-points."footman.tasks"]
"footman.docs" = "footman.tasks.docs:tasks"
"footman.env_files" = "footman.env_files"
"footman.new" = "footman.tasks.new"
"footman.self" = "footman.tasks.self_:tasks"
"footman.profile" = "footman.profile"

[tool.footman]

[dependency-groups]
dev = [
    # uv itself, unconstrained so it tracks latest — the lockfile still resolves
    # it to one exact version, so `fm sync` (and every lock write) runs the same
    # uv on every laptop and in CI. A mismatched *system* uv rewriting uv.lock is
    # the source of the one-line lockfile churn this removes.
    "uv",
    # The typed tool surfaces footman's own tasks run through — the spun-out
    # bridge, dogfooding the hosted lane. Dev-only: footman ships zero deps.
    # 0.6.1 is the floor for the as-handed `Call.args`/`Call.kwargs` record
    # the tasks suite asserts on under `toolroom.testing.answers()`, the
    # seam-level double the docs point bridge-call testers at (and the
    # earlier 0.5.1 floor still matters: below it the bridge stringifies
    # arguments before footman sees them, so a `Secret` passed to a typed
    # handle loses the marker and prints in the clear on every surface that
    # shows a command).
    "toolroom>=0.6.1",
    "pytest>=8.0",
    # For the env_files plugin's tests only — the plugin itself imports it
    # lazily and teaches by name when absent; never a runtime dependency.
    "python-dotenv>=1.0",
    "pytest-cov>=5.0",
    # Parallelise the suite across cores (`-n auto`, wired into addopts). The
    # gate is test-bound, so this roughly halves it; xdist runs workers as
    # processes, so subprocess/parallel coverage still merges cleanly.
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "basedpyright>=1.18",
    # The rest of the four-checker gate (notes/20260730-typing-citizenship.md):
    # all gating, none advisory — a checker footman uses is a checker the tree
    # is clean against. The lockfile pins them, so a new release only lands
    # through a deliberate lock bump, never mid-week.
    "mypy>=1.14",
    "ty",
    "pyrefly",
    # The optional fetch backends, so every one of them is driven against a
    # real server in the suite — footman never imports them itself.
    "httpx>=0.27",
    "requests>=2.31",
    "jedi>=0.20.0",
]
# rich renders the terminal screenshots `fm footman docs shots` embeds;
# pyte replays interactive captures (completion menus move the cursor —
# only a real terminal emulator can draw them) for `docs cast`. Both are
# pure Python, so CI can add them on every matrix job (3.14t included).
# Never footman runtime dependencies.
shots = ["rich>=13.0", "pyte>=0.8"]
# Documentation site (Zensical + mkdocstrings for the API reference).
# Installed only to build/serve docs. Never a footman runtime dependency.
docs = [
    "zensical>=0.0.50",
    "mkdocstrings-python>=1.11",
    { include-group = "shots" },
]
# Incumbent task runners, installed only for the head-to-head comparison under
# comparison/. Never a footman runtime or dev dependency.
comparison = [
    "duty>=1.4",
    "invoke>=2.2",
    "poethepoet>=0.27",
    "typer>=0.12",
]

[tool.uv]
# Sync the groups the gate needs by default, so a plain `uv sync` yields a green
# `fm check`: `shots` (rich/pyte — driven in the suite, imported by `docs shots`/
# `cast`) and `docs` (the strict site build + its mkdocs-driver tests). `dev` is
# uv's built-in default; it must be named here to stay in the set. `comparison`
# stays opt-in — heavy, only for comparison/.
default-groups = ["dev", "shots", "docs"]
# Never bind an environment to whatever python happens to be on PATH. A venv
# built on a python.org framework build has no CA bundle wired up — its
# `ssl.get_default_verify_paths().cafile` is None — so every registry the
# option history reads becomes unreachable, and only the tiers that shell out
# to uv still work. A uv-managed interpreter ships its certificates sorted, so
# requiring one turns a per-laptop mystery into a property of the project.
python-preference = "only-managed"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tasks fixtures deliberately shadow builtins (format, list) and take unused
# params to exercise the signature grammar.
"tests/**" = ["A", "B", "ARG"]
# The process-globals router is one deliberate monkeypatch: setattr IS the
# honest spelling there (a static assignment can't be blessed by any checker
# on any platform), so B010's "use direct assignment" advice is excused.
"src/footman/_globals.py" = ["B010"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` fans the suite across cores (pytest-xdist). It is test-bound, so
# this roughly halves both the local gate and every CI pytest job. To debug a
# single test serially (live `-s`, `--pdb`, `-x` ordering), override with `-n0`.
#
# `worksteal` rather than xdist's default `load`, because this suite's test
# durations are wildly uneven: test_shellcomp drives five real shells and
# everything else is microseconds. (Measured before the tool suites moved to
# toolroom; the shell tail still dominates, so the choice stands.)
# `load` hands out chunks up front, so one worker holds
# the slow tail while the rest idle; `worksteal` moves work to whoever is
# free. Measured locally, twice each: 20s load, 15s worksteal, 32s loadfile —
# loadfile being worst because it pins whole files, and the heavy files are
# exactly what needs splitting.
#
# The gain is a *developer machine* one, and that is the point: the gate runs
# many times per change here and once per push in CI. On CI it is a wash — one
# run each way moved the pytest step +2% overall (ubuntu -10%, windows +13%),
# inside the runners' own variance. Plausibly because those runners have 2-4
# cores, so there are few workers and little imbalance to exploit, while
# worksteal's rebalancing is not free. Do not expect this to show up there.
addopts = "-q -n auto --dist=worksteal"

[tool.mypy]
# The second gate of the four-checker matrix. footman itself is fully strict;
# tests and tasks.py run the usage-checking half only (check_untyped_defs, on
# via strict) — every test body type-checks as consumer code without demanding
# `-> None` on every def. Full test annotation is an agreed follow-up
# (notes/20260730-typing-citizenship.md). The tiers are inverted structurally:
# mypy's per-module patterns cannot address the tests' bare top-level module
# names (partial wildcards match nothing), but `footman.*` is a real package —
# so the global config is the tests tier and the override tightens footman.
# Narrow suppressions live inline as `# type: ignore[code]` with a reason;
# pyright-only suppressions use `# pyright: ignore` so warn_unused_ignores
# (also part of strict) keeps this checker's set honest.
files = ["src", "tests", "tasks.py"]
mypy_path = ["src"]
# Deterministic world, whatever host runs the check: unpinned, mypy assumes
# the host's platform and interpreter. linux is the bare-run default; the
# typecheck gate adds --platform darwin and --platform win32 runs (mypy has
# no all-platforms mode), so every platform's typeshed branches are checked
# from any machine. 3.11 is the floor basedpyright pins too.
platform = "linux"
python_version = "3.11"
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
# Tests reach through modules to monkeypatch (`_shellcomp.os`), and the rule
# keys on the accessed module's config — so it is off everywhere for mypy.
# The public surface's re-export discipline is policed by verifytypes, the
# __all__/TYPE_CHECKING drift tests, and basedpyright instead.
implicit_reexport = true

[[tool.mypy.overrides]]
module = "footman.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
# Generated tool stubs carry `# type: ignore[override]` for basedpyright's
# benefit; mypy doesn't need them and must not demand their removal.
module = "footman._stubs.*"
warn_unused_ignores = false

[tool.ty]
# Third gate. Scope: the library itself — the consumer seam in tests/ is
# already double-checked (basedpyright + mypy), and ty's fake-object
# modelling is not yet ready for the suite's doubles. The 13 monkeypatch
# assignments in _globals.py carry inline suppressions: ty refuses even a
# signature-identical patch of a module attribute (its module members are
# effectively Final), which is a modelling wall, not a defect here.
[tool.ty.src]
# The two tests/ files in ty's and pyrefly's scope, both never-executed
# clean-room shapes: typecheck_api.py (the consumer-shaped positive surface)
# and typecheck_workitem.py (the work-item spec's move-3 loom skeleton).
include = ["src", "tests/typecheck_api.py", "tests/typecheck_workitem.py"]

[tool.ty.environment]
# Every platform at once (ty checks the union), 3.11 floor.
python-platform = "all"
python-version = "3.11" 

[tool.pyrefly]
# Fourth gate, same scope as ty. Preset `default`, not `strict`: strict
# demands @override decorators, and `typing.override` is Python 3.12+ — a
# zero-dependency 3.11 library cannot spell it without growing a
# typing_extensions runtime dep. Revisit when 3.11 support ends.
preset = "default"
project-includes = ["src", "tests/typecheck_api.py", "tests/typecheck_workitem.py"]
# The includes above are the whole scope; nothing may subtract from them by
# accident. Ignore files and the hidden-directory heuristic are both
# path-dependent — a checkout under a dot-directory (a `.claude/worktrees/`
# worktree) had every include silently skipped and the gate failing on
# "no files matched". At the repo root neither setting changes anything.
use-ignore-files = false
disable-project-excludes-heuristics = true
# Every platform at once (pyrefly checks the union), 3.11 floor.
python-platform = "all"
python-version = "3.11"

[tool.pyrefly.errors]
# Warnings the gate holds at error, so they can't silently accumulate —
# both classes were fixed to zero before being pinned. `deprecated` is
# typeshed speaking (e.g. `@contextmanager` returning `Iterator` gave way
# to `Generator`); `unnecessary-type-conversion` is a dead `str()`/`bool()`
# on a value the annotations already prove.
deprecated = "error"
unnecessary-type-conversion = "error"

[tool.basedpyright]
# First-party code only. comparison/ exercises third-party runners (duty,
# invoke, typer) whose stubs are incomplete and which are installed only in the
# `comparison` dependency group; it is linted by ruff but not type-checked here.
include = ["src", "tests", "scripts", "tasks.py"]
exclude = ["comparison"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.coverage.run]
branch = true
source = ["footman", "tasks"]
# Subprocess measurement: footman spawns real children — the completion
# hot path every shell hook invokes, the detached refresh and cache
# collector, the uv handoff, the `fm` inside every docs cast. They run
# real code and were invisible; conftest arms COVERAGE_PROCESS_START when
# the parent is measuring, and parallel mode lets each child write its own
# data file for the combine.
parallel = true
# Data files from Linux, macOS, and Windows matrix jobs merge into one
# total in CI — paths must be stored relative for that to line up.
relative_files = true

[tool.coverage.report]
show_missing = true
# Gated in CI (the README's coverage claim is enforced, not aspirational).
fail_under = 92
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

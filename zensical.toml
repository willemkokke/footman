[project]
site_name = "Footman"
site_description = "A task runner with typed commands and instant completion — the soul of duty and the UX of typer."
site_author = "Willem Kokke"
site_url = "https://willemkokke.github.io/footman/"
repo_url = "https://github.com/willemkokke/footman"
repo_name = "willemkokke/footman"
copyright = """
Copyright &copy; 2026 Willem Kokke — MIT licensed
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Basics" = [
      { "Typed signatures" = "typing.md" },
      { "Running tools" = "tools.md" },
      { "Chaining & parallelism" = "orchestration.md" },
      { "Asking for input" = "input.md" },
      { "Progress & timing" = "progress.md" },
      { "Monorepos & config" = "monorepos.md" },
      { "Testing your tasks" = "testing.md" },
      { "Cookbook" = "cookbook.md" },
    ] },
    { "In depth" = [
      { "Working directory & environment" = "working-dir.md" },
      { "The execution model" = "execution-model.md" },
      { "Composing tasks" = "composing.md" },
      { "Hooks & plugin options" = "hooks.md" },
      { "Notes & levels" = "notes.md" },
      { "Writing plugins" = "plugins.md" },
      { "Your tasks, documented" = "taskdocs.md" },
      { "Type-checking your tasks" = "typechecking.md" },
      { "Custom CLI" = "custom-cli.md" },
    ] },
    { "Completion" = [
      { "How it works" = "completion.md" },
      { "bash" = "completion-bash.md" },
      { "zsh" = "completion-zsh.md" },
      { "fish" = "completion-fish.md" },
      { "PowerShell" = "completion-pwsh.md" },
      { "nushell" = "completion-nushell.md" },
      { "Shell differences" = "completion-differences.md" },
    ] },
  ] },
  { "Foundations" = [
    { "Start here" = "foundations.md" },
    { "One process, many tasks" = "foundations-process.md" },
    { "The working directory" = "foundations-cwd.md" },
    { "The environment" = "foundations-env.md" },
    { "The shell" = "foundations-shell.md" },
    { "Spawning programs" = "foundations-spawning.md" },
    { "Threads & the GIL" = "foundations-threads.md" },
    { "Deadlocks" = "foundations-deadlocks.md" },
    { "The four globals, two regimes" = "foundations-regimes.md" },
  ] },
  { "Machine use" = [
    { "Pipelines" = "pipelines.md" },
    { "JSON output" = "json.md" },
    { "Profiling a run" = "profiling.md" },
    { "CI" = "ci.md" },
    { "AI agents" = "agents.md" },
  ] },
  { "About" = [
    { "Comparison" = "comparison.md" },
    { "Migrating" = "migrating.md" },
    { "Stability promise" = "stability.md" },
    { "Coverage" = "coverage.md" },
    { "Changelog" = "changelog.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
  { "Reference" = [
    { "Design" = "design.md" },
    { "CLI reference" = "reference.md" },
    { "Configuration" = "configuration.md" },
    { "API reference" = "api.md" },
    { "Task reference (generated)" = "tasks/index.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Errors & notes" = "_generated/errors.md" },
  ] },
  { "Playground" = "playground.md" },
]

# The playground: Pyodide-backed live editor + per-example "run it there"
# links. One module script on every page; it no-ops where nothing applies.
extra_css = [
  "assets/palette.css",
  "assets/type.css",
  "assets/playground.css",
  "assets/casts.css",
]
extra_javascript = [
  { path = "assets/playground.js", type = "module", defer = true },
  # Inlines each animated cast and hangs play/pause/scrub off it, so a
  # recording can be replayed without reloading the page.
  { path = "assets/casts.js", type = "module", defer = true },
]

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  # toolroom's symbols, so the pages that describe the seam link into it
  # rather than describing it twice. toolroom resolves footman's the same
  # way; neither package depends on the other.
  "https://willemkokke.github.io/toolroom/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
backlinks = "tree"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
heading_level = 2

[project.theme]
language = "en"
# Fira Code for code, with ligatures in Python blocks only — see
# assets/type.css. Inline code in prose keeps the theme's plain glyphs, and
# so do terminal transcripts: a shell does not draw `!=` as `≠`.
font.text = "Inter"
font.code = "Fira Code"
# One template override, `overrides/main.html`: the link-preview meta tags.
# Zensical ships no social-card plugin, so a posted URL renders as a bare
# link without them.
custom_dir = "overrides"
# The concierge bell: you ring, the footman runs the errand. Same lucide
# family as the palette toggles; the favicon is the identical glyph.
icon.logo = "lucide/concierge-bell"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Three palettes: follow the OS by default, with a manual light/dark/auto
# toggle cycle — Material's automatic-mode pattern.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/willemkokke/footman"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/footman/"

# Markdown extensions — the validated default set from `zensical new`.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
# Include the repo-root CHANGELOG.md into docs/changelog.md — one source of truth,
# and auto-append the abbreviations glossary to every page so footman's coined
# terms (manifest, cascade, chain, taught error, …) get a hover tooltip at
# every occurrence, defined once.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
auto_append = ["docs/includes/abbreviations.md"]
